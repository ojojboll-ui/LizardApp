<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lizard">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>Lizard Loopsynth</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="top">
    <div class="brand">🦎 <b>Lizard</b></div>
    <div id="key" class="key">–</div>
    <div class="beats"><i class="beat"></i><i class="beat"></i><i class="beat"></i><i class="beat"></i></div>
    <button id="btnSettings" class="gear" type="button" aria-label="Settings">⚙</button>
  </header>

  <main>
    <!-- Simple main screen -->
    <section id="play" class="view">
      <div id="chords" class="chords"></div>
      <div id="songInfo" class="songinfo" hidden></div>

      <div class="meters slim">
        <div class="meter"><span>IN</span><div><i id="inMeter"></i></div></div>
        <div class="meter"><span>OUT</span><div><i id="outMeter"></i></div></div>
      </div>

      <h2 class="label">Sound</h2>
      <div id="scenes" class="scenes"></div>

      <div class="pads main">
        <button id="btnLoop" class="pad loop" type="button"><b>LOOP</b><small></small></button>
        <button id="btnFreeze" class="pad" type="button"><b>FREEZE</b><small>hold the sound</small></button>
        <button id="btnNew" class="pad" type="button"><b>NEW CHORDS</b><small>shake it up</small></button>
        <button id="btnRec" class="pad rec" type="button"><b>RECORD</b><small>to a wav file</small></button>
      </div>
      <div class="loopprog"><i id="loopBar"></i></div>
      <div class="looprow">
        <button id="btnUndo" class="link" type="button" disabled>Undo last layer</button>
        <button id="btnClear" class="link" type="button">Clear loop</button>
      </div>

      <div id="simpleControls" class="simple"></div>
    </section>

    <!-- Everything else -->
    <section id="settings" class="view" hidden>
      <div class="settings-head">
        <button id="btnBack" type="button">← Back</button>
        <h1>Settings</h1>
        <span id="bpm" class="bpm"></span>
      </div>

      <details class="section" open>
        <summary>Performance</summary>
        <div class="body">
          <div class="listen">
            <canvas id="chroma"></canvas>
          </div>
          <div class="pads">
            <button id="btnSample" class="pad small" type="button"><b>SAMPLE</b><small>sound → chord</small></button>
            <button id="btnSong" class="pad small" type="button"><b>MAGIC SONG</b><small>from randomness</small></button>
            <button id="btnMode" class="pad small" type="button"><b>GECHO MODE</b><small>Classic</small></button>
            <button id="btnEcho" class="pad small" type="button"><b>CAPTURE ECHO</b><small>into the echo chamber</small></button>
            <button id="btnMarbles" class="pad small" type="button"><b>MARBLES</b><small>random in time</small></button>
            <button id="btnWarps" class="pad small" type="button"><b>WARPS</b><small>off</small></button>
            <button id="btnElements" class="pad small" type="button"><b>ELEMENTS</b><small>modal instrument</small></button>
            <button id="btnBeads" class="pad small" type="button"><b>BEADS</b><small>grains of the room</small></button>
            <button id="btnSeed" class="pad small" type="button"><b>SEED</b><small>one Beads grain</small></button>
          </div>
          <div class="gyrorow">
            <button id="btnGyro" class="toggle" type="button">Gyro: OFF</button>
            <button id="btnCal" type="button">Recenter</button>
            <div id="gyroPad" class="gyropad off"><i id="gyroDot"></i></div>
          </div>
          <div id="xyPad" class="xypad"><i id="xyDot"></i><span id="xyLabel"></span></div>
        </div>
      </details>

      <details class="section">
        <summary>Mixer</summary>
        <div id="macros" class="body"></div>
      </details>

      <div id="sections"></div>
      <p class="foot">Inspired by Gechologic's Gecho and Mutable Instruments (Plaits, Rings, Clouds, Elements, Beads, Warps, Marbles).</p>
    </section>
  </main>

  <div id="fileOffer" class="fileoffer" hidden>
    <span id="fileName"></span>
    <button id="fileSave" type="button">Save / share</button>
    <button id="fileClose" type="button" aria-label="Close">✕</button>
  </div>

  <div id="start" class="overlay">
    <div class="card">
      <div class="logo">🦎</div>
      <h1>Lizard Loopsynth</h1>
      <p>Listens to the room and turns it into chords, grains and endless loops.</p>
      <p class="hint">How are you listening?</p>
      <button type="button" data-headphones="1">🎧 Headphones <small>best sound</small></button>
      <button type="button" data-headphones="0" class="secondary">🔊 Phone speaker <small>echo cancellation on</small></button>
      <p id="startMsg" class="msg"></p>
    </div>
  </div>
  <div id="resume" class="overlay" hidden><div class="card"><button type="button">Tap to continue</button></div></div>
  <div id="toast" class="toast"></div>

  <script type="module" src="js/main.js?v=8"></script>
</body>
</html>
